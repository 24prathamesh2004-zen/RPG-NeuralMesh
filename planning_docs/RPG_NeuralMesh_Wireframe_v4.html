<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPG NeuralMesh</title>
<style>
:root{--bg:#f4f5fb;--sf:#fff;--ln:#e4e6f2;--tx:#1b1f3b;--mu:#68708f;--ac:#4c5fd5;--as:#eceefc;--ok:#12a375;--oks:#dff6ee;--wa:#d9820b;--was:#fff1d6;--er:#d9433f;--ers:#fde6e5;color-scheme:light}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:224px 1fr;height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:18px 12px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;padding:0 8px 18px}.logo b{width:32px;height:32px;border-radius:10px;background:conic-gradient(#e8590c,#f59f00,#12a375,#1c7ed6,#7048e8,#d6336c,#e8590c);display:grid;place-items:center}.logo b:after{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;margin:2px 0;font-weight:600}nav a:hover{background:var(--bg)}nav a.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px #4c5fd54d}nav a i{font-style:normal;width:18px;text-align:center}
nav .bd{margin-left:auto;background:var(--er);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;gap:12px;align-items:center;padding:10px 26px;background:var(--sf);border-bottom:1px solid var(--ln)}
.top select{border:1px solid var(--ln);border-radius:10px;padding:6px 10px;background:#fff}.sp{flex:1}
.bell{position:relative;cursor:pointer;font-size:18px}.bell b{position:absolute;top:-6px;right:-8px;background:var(--er);color:#fff;border-radius:10px;font-size:10px;padding:0 5px}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
#view{padding:24px 26px 56px;overflow:auto;flex:1}
h1{font-size:26px;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin:2px 0 18px}
.ib{width:22px;height:22px;border-radius:50%;border:1px solid var(--ln);background:#fff;color:var(--mu);font-size:12px;cursor:pointer}
.info{background:var(--as);border-radius:10px;padding:8px 14px;margin:8px 0 14px;font-size:13px;color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:0 1px 2px #1b1f3b0a}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mt{margin-top:18px}
.kpi{border:0;display:flex;gap:12px;align-items:center}.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:#fff;flex:none}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.kpi .l{color:var(--mu);font-size:12.5px}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mu);white-space:nowrap}.pill.ok{background:var(--oks);color:var(--ok)}.pill.wa{background:var(--was);color:var(--wa)}.pill.er{background:var(--ers);color:var(--er)}.pill.ac{background:var(--as);color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 18px;cursor:pointer;font-weight:700}.btn:hover{filter:brightness(1.08)}.btn.gh{background:#fff;color:var(--tx);border:1px solid var(--ln)}.btn.sm{padding:4px 12px;font-size:13px}.btn.dn{background:#fff;color:var(--er);border:1px solid #f1c4c2}.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea,input[type=text]{width:100%;border:1px solid var(--ln);border-radius:12px;padding:11px 14px;background:#fff;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.m{margin-top:12px}
.chip{--c:#4c5fd5;border:1.5px solid var(--ln);border-radius:20px;padding:3px 13px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}.chip:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff)}.chip.off{opacity:.4;cursor:not-allowed}.chip.busy{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}.chip.blk{border-color:var(--wa);background:var(--was)}
.tab{padding:6px 16px;border-radius:20px;cursor:pointer;font-weight:600;color:var(--mu)}.tab.on{background:var(--tx);color:#fff}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mu);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--ln)}td{padding:10px;border-bottom:1px solid #eff0f8;vertical-align:middle}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.tr{list-style:none;padding:0;margin:0}.tr li{padding:4px 0;color:var(--mu)}.tr li.d{color:var(--tx)}.tr li.d:before{content:"✓ ";color:var(--ok);font-weight:700}.tr li.a:before{content:"… ";color:var(--ac)}
sup.rf{background:var(--ac);color:#fff;border-radius:5px;padding:0 5px;font-weight:700;font-size:11px;margin:0 2px}
.src{border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:#fff}.src p{margin:4px 0 0;color:var(--mu);font-size:13px}
.bar{height:9px;background:#eceef8;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--ac))}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden}.seg button{border:0;background:#fff;padding:3px 10px;cursor:pointer;font-size:12px;font-weight:700;color:var(--mu)}.seg button.on{background:var(--ac);color:#fff}.seg button:disabled{opacity:.35;cursor:not-allowed}
.tg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eff0f8}.sw{width:38px;height:22px;border-radius:12px;background:#ccd0e3;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ok)}.sw.on:after{left:18px}
.nc{border-top:6px solid var(--c);border-radius:16px}.lv{display:flex;gap:4px}.lv s{flex:1;height:7px;border-radius:4px;background:#e8eaf5}.lv s.f{background:var(--c)}.lv s.t{background:color-mix(in srgb,var(--c) 28%,#fff)}
.fl{stroke-dasharray:6 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-12}}@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.mp g{cursor:pointer}.mp g:hover circle{filter:brightness(1.1)}
.ov{position:fixed;inset:0;background:#1b1f3b55;display:grid;place-items:center;z-index:20}.md{background:#fff;border-radius:18px;padding:24px;width:min(520px,92vw);box-shadow:0 20px 50px #1b1f3b40}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);background:#fff;box-shadow:-10px 0 30px #1b1f3b22;z-index:15;padding:22px;overflow:auto}
.opt{border:1.5px solid var(--ln);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;display:block}.opt.on{border-color:var(--ac);background:var(--as)}.muted{color:var(--mu)}.hash{font:12px Consolas,monospace;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--ac)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--tx);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.s{opacity:1}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}nav{display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--ln)}nav a{white-space:nowrap}.logo span{display:none}.main{height:auto}.g2,.g3,.g4{grid-template-columns:1fr}#view{padding:16px}table{display:block;overflow-x:auto}}
</style></head><body>
<div class="app"><nav id="nav"></nav><div class="main"><div class="top"><select id="sc" onchange="setScope(this.value)"><option value="all">Scope: all connected companies</option><option value="ck">Scope: CEAT + KEC</option><option value="z">Scope: Zensar only</option><option value="ch">Scope: CEAT + Harrisons</option></select><span class="sp"></span><span class="bell" onclick="S.gt='app';go('gov')" title="Approvals">🔔<b id="bb"></b></span><div class="av">GS</div></div><div id="view"></div></div></div>

<script>

const nm=id=>N.find(n=>n.id==id),liveN=()=>N.filter(n=>n.live);
const S={page:'dash',gt:'app',info:0,scope:new Set(['ceat','kec','zen','har']),ran:0,req:0,vf:0,intro:{},af:'All',w:{}};
const NAV=[['dash','Dashboard','▦'],['ask','Ask NeuralMesh','◎'],['exp','Expert Finder','☺'],['nodes','Mesh Nodes','⬡'],['gov','Governance','⛨'],['adm','Admin','⚙']];
const NOTE={dash:['See the health and value of the whole mesh at a glance','Group CDO, Mesh Council','Usage, knowledge flows, return model, open items'],ask:['Ask once, get a cited answer from several companies','Engineers, PMO, strategy','Question, scope, per-source access, confidence'],exp:['Find the people who solved it before, with consent','Anyone facing a known problem','Expert directory, authored documents'],nodes:['See who is connected and bring the next company in','Node owners, platform team','Maturity, health, owner, onboarding'],gov:['Release, restrict and prove every access','Data owners, CISO, DPO, audit','Approvals, exposure rules, hash-chained log'],adm:['Run the shared plumbing: registry, vocabulary, guardrails, models','Platform team, CISO','Registry, ontology, guardrails, model gateway']};

const AUD=[['09:02:11','Strategy lead','CEAT','Search','L-01','Allowed: summary'],['09:02:12','Strategy lead','KEC','Search','L-02','Allowed: summary'],['09:02:12','Strategy lead','CEAT','Search','F-06','Blocked: UPSI window'],['09:14:40','Zensar AI CoE','CEAT','Request access','E-02','Pending approval'],['09:31:05','KEC bid lead','Zensar','Search','C-05','Allowed: full'],['10:05:23','Ventures analyst','KEC','Find experts','F-04','Allowed: consented']];

const EXP=[{r:'Integration PMO lead',n:'ceat',sk:['Acquisition integration','Plant ramp-up','Supplier transition'],ev:'Authored the L-01 playbook; 2 post-mortems',m:94},{r:'Programme director, international integration',n:'kec',sk:['Cross-border integration','Labour & contracts'],ev:'Led the L-02 post-mortem; 3 project reviews',m:91},{r:'Head of delivery excellence',n:'zen',sk:['PMO playbooks','AI-assisted delivery'],ev:'Owns the C-05 playbooks',m:84},{r:'Senior supply-chain manager',n:'ceat',sk:['Supplier dependency','Raw-material risk'],ev:'Contributed to 4 RCAs',m:78}];
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`,dot=id=>`<i class="dt" style="background:${CO[id]}"></i>`;
const nowT=()=>new Date().toTimeString().slice(0,8),pend=()=>AR.filter(a=>a.st=='p').length;
const log=(a,n,ac,d,dc)=>AUD.unshift([nowT(),a,n,ac,d,dc]);
const hx=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),2200)}
function nav(){$('#nav').innerHTML=`<div class="logo"><b></b><span>RPG NeuralMesh</span></div>`+NAV.map(([k,l,i])=>`<a class="${S.page==k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}${k=='gov'&&pend()?`<span class="bd">${pend()}</span>`:''}</a>`).join('');$('#bb').textContent=pend()||''}
function hd(t,s){const n=NOTE[S.page];return`<h1>${t}<button class="ib" title="About this screen" onclick="S.info=!S.info;go(S.page)">i</button></h1><p class="sub">${s}</p>${S.info?`<div class="info"><b>Purpose:</b> ${n[0]} &nbsp;·&nbsp; <b>User:</b> ${n[1]} &nbsp;·&nbsp; <b>Data:</b> ${n[2]}</div>`:''}`}
function go(p){S.page=p;closeAll();nav();$('#view').innerHTML=P[p]();if(p=='dash')roi();$('#view').scrollTop=0}
function closeAll(){$('#ov').innerHTML='';$('#dr').innerHTML=''}
function setScope(v){S.scope=new Set(v=='all'?liveN().map(n=>n.id):v=='ck'?['ceat','kec']:v=='ch'?['ceat','har']:['zen']);S.ran=0;if(S.page=='ask')go('ask')}
const P={};
/* DASHBOARD */
function meshSvg(){const cx=280,cy=165;let l='',g='';N.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/N.length,x=cx+215*Math.cos(a),y=cy+118*Math.sin(a),c=CO[n.id];l+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${n.live?c:'#c9cde3'}" stroke-width="${n.live?3:1.5}" ${n.live?'class="fl"':'stroke-dasharray="3 6"'}/>`;g+=`<g onclick="showNode('${n.id}')"><circle cx="${x}" cy="${y}" r="27" fill="${n.live?c:'#fff'}" stroke="${c}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="${n.live?'#fff':c}">${n.s.slice(0,2).toUpperCase()}</text><text x="${x}" y="${y+46}" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1f3b">${n.s}</text></g>`});
return`<svg class="mp" viewBox="0 0 560 330" style="width:100%">${l}<circle cx="${cx}" cy="${cy}" r="46" fill="#4c5fd5"/><circle cx="${cx}" cy="${cy}" r="56" fill="none" stroke="#4c5fd5" stroke-opacity=".2" stroke-width="6"/><text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#fff" font-weight="800" font-size="13">NeuralMesh</text><text x="${cx}" y="${cy+14}" text-anchor="middle" fill="#fff" fill-opacity=".8" font-size="11">orchestrator</text>${g}</svg>`}
P.dash=()=>`${hd('Group knowledge, connected','Pilot view: illustrative sample figures, not measured production results.')}
<div class="g4">${[['1,248','Questions asked','▲ 22% week on week','#4c5fd5','◎'],['68%','Rated useful','Target 60%','#12a375','★'],['6.8 s','Median answer time','Across 3.1 companies','#e09100','⏱'],['0','Raw records migrated','Only approved summaries may cross','#d6336c','⛨']].map(k=>`<div class="card kpi" style="background:color-mix(in srgb,${k[3]} 9%,#fff)"><div class="ic" style="background:${k[3]}">${k[4]}</div><div><div class="v">${k[0]}</div><div class="l">${k[1]}<br><b style="color:${k[3]}">${k[2]}</b></div></div></div>`).join('')}</div>
<div class="g2 mt"><div class="card"><div class="row"><h2 style="margin:0">The mesh, live</h2><span class="sp"></span>${pill(liveN().length+' of '+N.length+' connected','ok')}</div>${meshSvg()}<p class="muted" style="margin:0">Click a company to see its node or start onboarding.</p></div>
<div style="display:flex;flex-direction:column;gap:18px"><div class="card"><h2>Needs attention</h2>${[[pend()+' approvals waiting','Data owners are blocking answers',"S.gt='app';go('gov')",'wa'],['CEAT-Harrisons pilot','Owner-approved summaries only',"S.scope=new Set(['ceat','har']);S.ran=0;go('ask')",'ac'],['Expert opt-in is 33% at KEC','Fewer experts can be found',"go('exp')",'er']].map(a=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eff0f8"><div style="flex:1"><b>${a[0]}</b><div class="muted">${a[1]}</div></div><button class="btn gh sm" onclick="${a[2]}">Open</button></div>`).join('')}</div>

<div class="g3 mt"><div class="card"><h2>Who supplies, who uses</h2>${[['ceat',330,300],['kec',290,320],['zen',270,270]].map(([i,g,r])=>`<div style="margin:12px 0"><div class="row"><b>${dot(i)}${nm(i).s}</b><span class="sp"></span><span class="muted">gave ${g} · used ${r}</span></div><div class="bar" style="--c:${CO[i]}"><i style="width:${g/4.4}%"></i></div></div>`).join('')}<p class="muted" style="margin:0">Balanced flows: no company only takes.</p></div>

<div class="card"><h2>Weekly questions</h2><div style="display:flex;align-items:flex-end;gap:12px;height:140px;padding-top:20px">${[190,260,330,468].map((v,i)=>`<div style="flex:1;height:${v/468*100}%;background:${['#c9d0f7','#a5b0f0','#7d8de6','#4c5fd5'][i]};border-radius:8px 8px 0 0;position:relative"><span style="position:absolute;top:-19px;width:100%;text-align:center;font-size:12px;font-weight:700">${v}</span></div>`).join('')}</div><div class="row" style="justify-content:space-around"><span class="muted">W1</span><span class="muted">W2</span><span class="muted">W3</span><span class="muted">W4</span></div></div></div>`;
function roi(){const q=+$('#iq').value,b=q*4.3*.55*(40/60)*1500/1e5,n=b-12;$('#oq').textContent=q;$('#rn').textContent=(n<0?'-':'+')+'₹'+Math.abs(n).toFixed(1)+' L';$('#rn').style.color=n<0?'var(--er)':'var(--ok)';$('#rv').textContent='benefit ₹'+b.toFixed(1)+' L'}
function showNode(id){const n=nm(id),c=CO[id];$('#dr').innerHTML=`<div class="row"><h2 style="margin:0;color:${c}">${n.n}</h2><span class="sp"></span><button class="ib" onclick="closeAll()">✕</button></div><p>${n.live?pill('Healthy','ok'):pill(n.w,'wa')}</p>${n.live?`<div class="tg"><span>Maturity</span><b>L${n.cur}</b></div><div class="tg"><span>Datapoints</span><b>${n.dp}</b></div><div class="tg"><span>p95 latency</span><b>${n.p95} ms</b></div>`:`<div class="tg"><span>Target maturity</span><b>L${n.tgt}</b></div>`}<div class="tg"><span>Owner</span><b>${n.own}</b></div><div class="tg"><span>Sources</span><span class="muted">${n.src}</span></div><div class="row m">${n.live?`<button class="btn" onclick="S.scope=new Set(['${id}']);S.ran=0;go('ask')">Ask this company</button>`:`<button class="btn" onclick="S.wiz={n:'${id}',s:0,l:${Math.min(n.tgt,1)}};wiz()">Start onboarding</button>`}</div>`}
/* ASK */
P.ask=()=>`${hd('Ask the group','One question, routed to authorized subsidiary MCP nodes. Source systems stay local; permitted answers may cross.')}
<div class="card"><textarea id="q" rows="2">What rubber-compound learnings from CEAT could reduce Harrisons Malayalam's latex spoilage?</textarea>
<div class="row m">${N.map(n=>`<span class="chip ${n.live?(S.scope.has(n.id)?'on':''):'off'}" id="c-${n.id}" style="--c:${CO[n.id]}" title="${n.live?'':'Not connected'}" onclick="tg('${n.id}')">${n.s}</span>`).join('')}<span class="sp"></span><select><option>Problem solving</option><option>Bid support</option><option>Compliance check</option></select><button class="btn" onclick="run()">Ask NeuralMesh</button></div></div>
<div class="mt" id="res">${S.ran?ans():'<div class="card muted">Illustrative sample. Each subsidiary node enforces its own policy before approved results are returned.</div>'}</div>`;
function tg(id){if(!nm(id).live)return;S.scope.has(id)?S.scope.delete(id):S.scope.add(id);S.ran=0;go('ask')}
function run(){const L=liveN().filter(n=>S.scope.has(n.id));if(!L.length){$('#res').innerHTML='<div class="card">Select at least one connected company.</div>';return}
const st=['Understanding question and purpose','Routing via the registry','Asking each company in parallel','Each company applies its own policy','Fusing, citing, applying guardrails'];let i=0;
const t=setInterval(()=>{$('#res').innerHTML=`<div class="card"><ul class="tr">${st.map((s,k)=>`<li class="${k<i?'d':k==i?'a':''}">${s}</li>`).join('')}</ul></div>`;L.forEach(n=>{const e=$('#c-'+n.id);if(e)e.className='chip on'+(i==2?' busy':i==3&&n.id=='ceat'?' blk':'')});
if(i>=st.length){clearInterval(t);S.ran=1;log('Group user','Mesh','Cross-query','E-03, O-05, E-01','2 approved summaries, restricted formulation metadata only');$('#res').innerHTML=ans()}i++},420)}
function ans(){const v=SRC.filter(s=>S.scope.has(s.node)),ok=v.filter(s=>s.st=='ok').length,cf=Math.min(92,40+ok*17),r=n=>v.find(s=>s.n==n)?`<sup class="rf">${n}</sup>`:'';
return`<div class="g2"><div class="card"><div class="row"><h2 style="margin:0">Answer</h2>${pill('Illustrative sample','ac')}<span class="sp"></span><span class="muted">Confidence</span><div class="bar" style="width:90px"><i style="width:${cf}%"></i></div><b>${cf}%</b></div>
<p><b>Pilot hypothesis, not a validated finding:</b> compare CEAT's owner-approved, non-formula handling and storage learnings with Harrisons' aggregated latex-spoilage trends. The comparison may identify practices to test locally; it does not disclose compound formulations or estate-level records.${r(1)}${r(2)}</p>
<div class="row m"><button class="btn gh sm" onclick="toast('Saved to institutional memory')">Save to memory</button><button class="btn gh sm" onclick="go('exp')">Find the people behind this</button><span class="sp"></span><button class="btn gh sm" onclick="toast('Feedback recorded')">Useful</button><button class="btn gh sm" onclick="toast('Feedback recorded')">Not useful</button></div></div>
<div>${v.map(s=>`<div class="src" style="--c:${CO[s.node]}"><div class="row"><sup class="rf">${s.n}</sup><b>${s.t}</b></div><div class="row" style="margin-top:4px">${pill(nm(s.node).s)}${pill(s.id)}${pill(s.m)}${s.st=='ok'?pill('Granted','ok'):s.st=='md'?pill('Metadata only','wa'):s.st=='pend'?pill(S.req?'Request raised':'Needs approval','wa'):pill('Blocked by policy','er')}</div><p>${s.w}</p></div>`).join('')}<div class="muted" style="text-align:center">${v.length} sources · ${new Set(v.map(s=>s.node)).size} companies · <b style="color:var(--ok)">0 source records migrated; approved summaries only</b></div></div></div>`}
/* EXPERTS */
P.exp=()=>`${hd('Expert Finder','Search by problem, not by name. A name appears only after the expert accepts.')}
<div class="card"><input type="text" value="overseas acquisition integration, supplier dependency"><div class="row m">${['All',...liveN().map(n=>n.s)].map((c,i)=>`<span class="chip ${S.vf==i?'on':''}" style="--c:${i?CO[liveN()[i-1].id]:'#4c5fd5'}" onclick="S.vf=${i};go('exp')">${c}</span>`).join('')}</div></div>
<div class="g2 mt"><div>${EXP.filter(e=>!S.vf||liveN()[S.vf-1].id==e.n).map(e=>`<div class="card" style="margin-bottom:14px;border-left:6px solid ${CO[e.n]}"><div class="row"><div class="av" style="background:${CO[e.n]}">${nm(e.n).s.slice(0,2).toUpperCase()}</div><div><b>${e.r}</b><div class="muted">${nm(e.n).n}</div></div><span class="sp"></span>${pill(e.m+'% match','ac')}</div><div class="row m">${e.sk.map(k=>pill(k)).join('')}</div><p class="muted" style="margin:8px 0">Evidence: ${e.ev}</p><button class="btn ${S.intro[e.r]?'gh':''} sm" ${S.intro[e.r]?'disabled':''} onclick="intro('${e.r}','${e.n}')">${S.intro[e.r]?'Introduction requested':'Ask for introduction'}</button></div>`).join('')}</div>
<div class="card" style="align-self:start"><h2>Directory coverage</h2><p class="muted">Illustrative opt-in coverage; participation is consent-based.</p>${[['ceat',41],['kec',33],['zen',58],['har',24]].map(([i,v])=>`<div style="margin:12px 0"><div class="row"><b>${dot(i)}${nm(i).s}</b><span class="sp"></span><b>${v}%</b></div><div class="bar" style="--c:${CO[i]}"><i style="width:${v}%"></i></div></div>`).join('')}<p class="muted" style="margin:0">Only role, skills and evidence are shown. Personal data stays in each HR system.</p></div></div>`;
function intro(r,n){S.intro[r]=1;log('Strategy lead',nm(n).s,'Find experts','F-04','Allowed: consented');toast('Introduction requested');go('exp')}
/* NODES */
const lv=n=>`<div class="lv" style="--c:${CO[n.id]}">${[0,1,2,3].map(i=>`<s class="${n.live&&i<=n.cur?'f':i<=n.tgt?'t':''}"></s>`).join('')}</div>`;
P.nodes=()=>`${hd('Mesh Nodes','Each company runs its own node and chooses how deep to go.')}
<div class="row" style="margin-bottom:16px">${[['L0','Metadata only'],['L1','Summaries + experts'],['L2','Retrieval'],['L3','Agentic']].map(l=>pill('<b>'+l[0]+'</b> '+l[1],'ac')).join('')}</div>
<div class="g3">${N.map(n=>`<div class="card nc" style="--c:${CO[n.id]}"><div class="row"><b style="font-size:16px">${n.n}</b><span class="sp"></span>${n.live?pill('Healthy','ok'):pill(n.w,'wa')}</div><div class="muted" style="margin:4px 0 12px">${n.src}</div>${lv(n)}<div class="row" style="justify-content:space-between;margin:6px 0 12px"><span class="muted">${n.live?'L'+n.cur+' now · target L'+n.tgt:'Target L'+n.tgt}</span><span class="muted">${n.live?n.p95+' ms · '+n.dp+' datapoints':n.own}</span></div>${n.live?`<button class="btn gh sm" onclick="showNode('${n.id}')">Details</button>`:`<button class="btn sm" onclick="S.wiz={n:'${n.id}',s:0,l:${Math.min(n.tgt,1)}};wiz()">Onboard</button>`}</div>`).join('')}</div>`;
function wiz(){const w=S.wiz,n=nm(w.n),c=CO[n.id],s=w.s;closeAll();
const b=[`<h2>How deep to start?</h2>${[['L0 Metadata','Catalogue entries only. Live in days.'],['L1 Summaries and experts','Recommended start for lite nodes.'],['L2 Retrieval','Retrieval over approved collections.']].map((o,i)=>`<label class="opt ${w.l==i?'on':''}" onclick="S.wiz.l=${i};wiz()"><b>${o[0]}</b><div class="muted">${o[1]}</div></label>`).join('')}`,
`<h2>Connect what exists</h2>${n.src.split(' · ').map(x=>`<div class="tg"><span>${x}</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div>`).join('')}<div class="tg"><span>HR directory (consent-based experts)</span><span class="sw ${w.l>0?'on':''}" onclick="this.classList.toggle('on')"></span></div><p class="muted">Defaults: Internal gets retrieval, Confidential gets summaries, Restricted stays metadata-only.</p>`,
`<h2>Validation</h2><ul class="tr" id="vl">${['Schema conforms to the node contract','Identity and mTLS handshake','Policy dry-run: Restricted returns metadata only','Prompt-injection tests pass','Heartbeat registered'].map(x=>`<li>${x}</li>`).join('')}</ul>`][s];
$('#ov').innerHTML=`<div class="ov"><div class="md" style="border-top:7px solid ${c}"><div class="row"><b style="color:${c};font-size:17px">Onboard ${n.n}</b><span class="sp"></span><span class="muted">Step ${s+1} of 3</span></div>${b}<div class="row m"><button class="btn gh" onclick="closeAll()">Cancel</button><span class="sp"></span>${s?`<button class="btn gh" onclick="S.wiz.s--;wiz()">Back</button>`:''}<button class="btn" id="nx" onclick="${s<2?'S.wiz.s++;wiz()':'fin()'}">${s<2?'Continue':'Go live'}</button></div></div></div>`;
if(s==2){$('#nx').disabled=true;let i=0;const t=setInterval(()=>{const li=document.querySelectorAll('#vl li');if(!li.length)return clearInterval(t);if(li[i])li[i].className='d';i++;if(i>=li.length){clearInterval(t);$('#nx').disabled=false}},380)}}
function fin(){const n=nm(S.wiz.n);n.live=1;n.cur=S.wiz.l;n.p95=210;n.dp=18;S.scope.add(n.id);log('Node owner',n.s,'Node registered','Registry','Allowed');toast(n.n+' is now connected');go('nodes')}
/* GOVERNANCE */
P.gov=()=>{const t=S.gt;let body='';
if(t=='app')body=AR.map(a=>`<div class="card" style="margin-bottom:12px;border-left:6px solid ${CO[a.node]}"><div class="row"><b>${a.id}</b>${pill(nm(a.node).s)}${a.st=='p'?pill('Waiting '+a.age,'wa'):a.st=='a'?pill('Approved','ok'):pill('Denied','er')}</div><p style="margin:8px 0 2px"><b>${a.who}</b> wants <b>${a.dp}</b></p><p class="muted" style="margin:0">Purpose: ${a.pu}<br>Rule: ${a.rule}</p>${a.st=='p'?`<div class="row m"><span class="muted">Grant expires in 7 days</span><span class="sp"></span><button class="btn dn sm" onclick="dec('${a.id}','d')">Deny</button><button class="btn gh sm" onclick="dec('${a.id}','s')">Summary only</button><button class="btn sm" onclick="dec('${a.id}','a')">Approve full text</button></div>`:''}</div>`).join('');
if(t=='pol')body=`<div class="card"><p class="muted" style="margin-top:0">Restricted data is capped at metadata. Every change is versioned and logged.</p><table><tr><th>ID</th><th>Datapoint</th><th>Sensitivity</th><th>Exposure</th></tr>${CAT.map(c=>`<tr><td>${c[0]}</td><td>${dot(c[1])}${c[2]}</td><td>${pill({R:'Restricted',C:'Confidential',I:'Internal'}[c[3]],c[3]=='R'?'er':c[3]=='C'?'wa':'ok')}</td><td><div class="seg">${['MD','SUM','RAG','LIVE'].map(m=>`<button class="${c[4]==m?'on':''}" ${c[3]=='R'&&m!='MD'?'disabled title="Restricted: metadata only"':''} onclick="setM('${c[0]}','${m}','${c[1]}')">${m}</button>`).join('')}</div></td></tr>`).join('')}</table></div>`;
if(t=='aud'){let p='0';const rows=[...AUD].reverse().map(r=>{p=hx(p+r.join());return[...r,p]}).reverse();body=`<div class="row" style="margin-bottom:14px">${[['DPDP controls','Consent-based design','wa'],['SEBI UPSI blackout','Active','ok'],['Raychem / TE IP','Blocked until terms agreed','wa'],['Cross-border','Checked per query','ok']].map(c=>`<div class="card" style="flex:1;min-width:150px;padding:12px"><b>${c[0]}</b><br>${pill(c[1],c[2])}</div>`).join('')}</div><div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Decision log</h2><span class="muted">decisions only, never content</span><span class="sp"></span>${['All','Allowed','Blocked','Pending'].map(x=>`<span class="chip ${S.af==x?'on':''}" onclick="S.af='${x}';go('gov')">${x}</span>`).join('')}</div><table><tr><th>Time</th><th>Who</th><th>Company</th><th>Action</th><th>Item</th><th>Decision</th><th>Chain</th></tr>${rows.filter(r=>S.af=='All'||r[5].includes(S.af)).slice(0,9).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td class="hash">${r[6]}</td></tr>`).join('')}</table></div>`}
return`${hd('Governance','Data owners decide, policy enforces, the log proves.')}<div class="row" style="margin-bottom:16px">${[['app','Approvals ('+pend()+')'],['pol','Exposure rules'],['aud','Audit log']].map(x=>`<span class="tab ${t==x[0]?'on':''}" onclick="S.gt='${x[0]}';go('gov')">${x[1]}</span>`).join('')}</div>${body}`};
function dec(id,d){const a=AR.find(x=>x.id==id);a.st=d=='d'?'d':'a';log(nm(a.node).own,nm(a.node).s,d=='d'?'Denied':d=='s'?'Approved summary':'Approved full text',a.dp.split(' ')[0],d=='d'?'Denied':'Granted, time-boxed');toast(d=='d'?'Request denied':'Approved. Requester notified');go('gov')}
function setM(id,m,node){const c=CAT.find(x=>x[0]==id&&x[1]==node);c[4]=m;log('Node owner',nm(c[1]).s,'Policy change',id,'Exposure set to '+m);toast(id+' exposure: '+m);go('gov')}
/* ADMIN */
P.adm=()=>`${hd('Admin','The shared plumbing.')}<div class="card" style="margin-bottom:18px"><h2>Orchestrator pipeline</h2><div class="row">${['Understand + route','Fan-out','Fuse + re-rank','Cite','Guardrails','Human approval','Answer'].map((x,i)=>`<span class="pill ac" style="padding:5px 14px">${x}</span>${i<6?'<span class="muted">›</span>':''}`).join('')}</div></div>
<div class="g3"><div class="card"><h2>MCP registry</h2><table>${N.map(n=>`<tr><td>${dot(n.id)}${n.s}</td><td class="muted">${n.live?'schema v1.2':'-'}</td><td>${n.live?pill('Active','ok'):pill('Planned')}</td></tr>`).join('')}</table></div>
<div class="card"><h2>Shared vocabulary</h2><p class="muted" style="margin-top:0">Different words, one concept.</p>${[['Root-cause analysis','RCA · 8D · CAPA · post-mortem'],['Integration lessons','playbook · day-100 review'],['Test qualification','type test · PQ · validation']].map(a=>`<div class="tg"><b>${a[0]}</b><span class="muted">${a[1]}</span></div>`).join('')}</div>
<div class="card"><h2>Guardrails and models</h2>${['Redact personal data','Block prompt injection','Check tool descriptions','Citation required','Per-node kill switch'].map(g=>`<div class="tg"><span>${g}</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div>`).join('')}<label class="opt on mt"><b>Approved group gateway</b><div class="muted">Local model per node for sensitive units</div></label></div></div>`;
nav();setScope('all');go('dash');
</script></body></html>
