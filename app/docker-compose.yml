# The mesh as containers: four subsidiary nodes, the API, the MCP gateway. The embedding model folder must be
# mounted (all-MiniLM-L6-v2 as ONNX) and the packs built once with `python -m knowledge.packgen` inside the API container.
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - NEURALMESH_CEAT_URL=http://ceat:8101/mcp
      - NEURALMESH_KEC_URL=http://kec:8102/mcp
      - NEURALMESH_ZENSAR_URL=http://zensar:8103/mcp
      - NEURALMESH_HARRISONS_URL=http://harrisons:8104/mcp
      - NEURALMESH_EMBEDDING_MODEL_DIR=/models/all-MiniLM-L6-v2
    volumes:
      - ./.neuralmesh:/app/.neuralmesh
      - ./neuralmesh_kb_pack:/app/neuralmesh_kb_pack
      - ${NEURALMESH_EMBEDDING_MODEL_DIR:-~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx}:/models/all-MiniLM-L6-v2:ro
    depends_on: [ceat, kec, zensar, harrisons]

  gateway:
    build: .
    ports: ["8100:8100"]
    env_file: .env
    environment:
      - NEURALMESH_MCP_HOST=0.0.0.0
      - NEURALMESH_EMBEDDING_MODEL_DIR=/models/all-MiniLM-L6-v2
    volumes:
      - ./.neuralmesh:/app/.neuralmesh
      - ./neuralmesh_kb_pack:/app/neuralmesh_kb_pack
      - ${NEURALMESH_EMBEDDING_MODEL_DIR:-~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx}:/models/all-MiniLM-L6-v2:ro
    command: python -m mcp_gateway.server
    depends_on: [api]

  ceat:
    build: .
    env_file: .env
    environment: [NEURALMESH_EMBEDDING_MODEL_DIR=/models/all-MiniLM-L6-v2, NEURALMESH_MCP_HOST=0.0.0.0]
    volumes:
      - ./neuralmesh_kb_pack:/app/neuralmesh_kb_pack
      - ${NEURALMESH_EMBEDDING_MODEL_DIR:-~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx}:/models/all-MiniLM-L6-v2:ro
    command: python -m mcp_nodes ceat

  kec:
    build: .
    env_file: .env
    environment: [NEURALMESH_EMBEDDING_MODEL_DIR=/models/all-MiniLM-L6-v2, NEURALMESH_MCP_HOST=0.0.0.0]
    volumes:
      - ./neuralmesh_kb_pack:/app/neuralmesh_kb_pack
      - ${NEURALMESH_EMBEDDING_MODEL_DIR:-~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx}:/models/all-MiniLM-L6-v2:ro
    command: python -m mcp_nodes kec

  zensar:
    build: .
    env_file: .env
    environment: [NEURALMESH_EMBEDDING_MODEL_DIR=/models/all-MiniLM-L6-v2, NEURALMESH_MCP_HOST=0.0.0.0]
    volumes:
      - ./neuralmesh_kb_pack:/app/neuralmesh_kb_pack
      - ${NEURALMESH_EMBEDDING_MODEL_DIR:-~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx}:/models/all-MiniLM-L6-v2:ro
    command: python -m mcp_nodes zensar

  harrisons:
    build: .
    env_file: .env
    environment: [NEURALMESH_EMBEDDING_MODEL_DIR=/models/all-MiniLM-L6-v2, NEURALMESH_MCP_HOST=0.0.0.0]
    volumes:
      - ./neuralmesh_kb_pack:/app/neuralmesh_kb_pack
      - ${NEURALMESH_EMBEDDING_MODEL_DIR:-~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx}:/models/all-MiniLM-L6-v2:ro
    command: python -m mcp_nodes harrisons
