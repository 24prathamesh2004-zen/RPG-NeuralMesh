# Node registry of RPG NeuralMesh. The API, the orchestrator, the nodes, the pack
# builder and the screens read the list of Mesh Nodes from this file only.
# A node URL can be overridden with NEURALMESH_<ID>_URL, a port with NEURALMESH_<ID>_PORT.
# shared: true marks the node that keeps the inputs that belong to no one company (the "Others" choice of the
# Context graph page). Every connected company reads them, nobody signs up for it, and no question names it.
embedding_model: all-MiniLM-L6-v2
nodes:
  - id: ceat
    display: CEAT
    port: 8101
    level: L2
    tone: "#e8590c"
  - id: kec
    display: KEC International
    port: 8102
    level: L2
    tone: "#1c7ed6"
  - id: zensar
    display: Zensar
    port: 8103
    level: L2
    tone: "#7048e8"
  - id: harrisons
    display: Harrisons Malayalam
    port: 8104
    level: L1
    tone: "#5c940d"
  - id: raychem
    display: Raychem RPG
    port: 8105
    level: L1
    tone: "#d6336c"
  - id: rpgls
    display: RPG Life Sciences
    port: 8106
    level: L1
    tone: "#0c8599"
  - id: asvata
    display: Asvata
    port: 8107
    level: L1
    tone: "#e67700"
  - id: others
    display: Others
    port: 8108
    level: L2
    tone: "#868e96"
    shared: true
