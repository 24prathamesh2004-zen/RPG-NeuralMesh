docs:
  - id: R-01-01
    dp: R-01
    title: Method - Carbon inventory boundary and scopes
    version: "2026-02"
    tags: [carbon, inventory, boundary, scopes, accounting]
    summary: Fix the boundary first by listing the sites and activities in scope. Sort each activity into direct fuel use, purchased energy or other indirect sources. Record every exclusion with a reason, so the total can be compared year to year.
    body: >-
      Fix the boundary before any data is collected. List the sites and activities in scope and sign the list off with the client.
      Sort each activity into direct fuel use, purchased energy or other indirect sources. Record every exclusion with a reason.
      Keep the boundary the same from year to year, or restate the earlier years when it changes.
  - id: R-01-02
    dp: R-01
    title: Method - Choosing and applying emission factors
    version: "2026-03"
    tags: [carbon, emission-factor, calculation, units]
    summary: Multiply each activity amount by one published emission factor for the same fuel or energy type and unit. Write down the factor source and year beside every line. Convert units before multiplying, for example litres to kilograms of fuel.
    body: >-
      Multiply each activity amount by one emission factor for the same fuel or energy type. The factor source and year are written
      beside every line of the workbook. Units are converted before multiplying, for example litres of diesel to kilograms.
      When a factor is replaced, the old and new totals are shown side by side. A reviewer re-calculates 5 lines of every 50.
  - id: R-01-03
    dp: R-01
    title: Method - Cleaning and checking a client data set
    version: "2026-01"
    tags: [data, cleaning, validation, duplicates, analysis]
    summary: Before any analysis, count rows, remove exact duplicates, mark missing values and check each column against its expected range. Keep the raw file untouched and log every change. A data set with more than 5 percent missing values in a key column goes back to the client.
    body: >-
      Count the rows and compare with the count the client stated. Remove exact duplicates and log how many were removed.
      Mark missing values and do not fill them silently. Check each column against its expected range, for example a month number
      between 1 and 12. The raw file stays untouched and all changes are made on a copy. If more than 5 percent of a key column is missing, the file goes back to the client.
  - id: R-01-04
    dp: R-01
    title: Method - Summaries, outliers and trend checks
    version: "2026-04"
    tags: [data, outlier, trend, summary, charts]
    summary: Report the median and the range beside the average. Flag any value more than 3 times the median of its group and ask the client about it before removing it. Compare each month with the same month last year before calling a change a trend.
    body: >-
      Report the median and the range beside the average. Any value more than 3 times the median of its group is flagged. The client is asked about
      a flagged value before it is removed. A change is called a trend only when it shows in at least 3 months in a row.
      Each month is compared with the same month of the previous year. Charts show the unit on the axis and start at zero for bars.
  - id: F-01-01
    dp: F-01
    title: Checklist - Compliance review of an engagement
    version: "2026-02"
    tags: [compliance, checklist, review, evidence]
    summary: Every engagement gets the same checklist with the scope, the data source, the sign-off name and the evidence file for each point. A point is complete only when the evidence file is attached. The reviewer signs after all points are complete.
    body: >-
      Every engagement uses the same compliance checklist. Each point names the scope, the data source and the person who signs.
      A point is complete only when its evidence file is attached. Open points are listed at the top of the checklist.
      The reviewer signs after all points are complete. The signed checklist is stored with the engagement file.
  - id: F-01-02
    dp: F-01
    title: Calendar - Compliance deadlines for client reporting
    version: "2026-03"
    tags: [compliance, calendar, deadlines, reporting, reminders]
    summary: A shared calendar lists each client filing date and the internal date 10 working days before it. Reminders go to the analyst and the coordinator at 20, 10 and 3 working days. A missed internal date is reported to the delivery head the same day.
    body: >-
      The shared calendar lists each client filing date and an internal date 10 working days before it. Reminders go to the analyst and the
      coordinator at 20, 10 and 3 working days before the internal date. A missed internal date is reported to the delivery head the same day.
      The coordinator updates the calendar when a client changes a filing date.
  - id: C-01-01
    dp: C-01
    title: Practice - Handling a client request at the service desk
    version: "2026-01"
    tags: [service-desk, client, request, response, ticket]
    summary: Every client request is logged with a ticket, acknowledged within 4 working hours and given an owner. The client is told the expected answer date in the first reply. A request is closed only after the client confirms the answer.
    body: >-
      Every client request is logged as a ticket and given an owner. The client receives an acknowledgement within 4 working hours.
      The first reply states the expected answer date. When the date will be missed, the client is told before the date, with a new date.
      A request is closed only after the client confirms the answer.
  - id: C-01-02
    dp: C-01
    title: Practice - Client updates and written reports
    version: "2026-02"
    tags: [communication, report, update, client, writing]
    summary: A client update opens with the result, then the reason, then what is needed from the client and by when. Reports use short sentences and define each term once. Numbers always carry their unit and period.
    body: >-
      A client update opens with the result, then gives the reason, then says what is needed from the client and by when.
      Reports use short sentences and define each term the first time it appears. Every number carries its unit and period, for example
      "212 tonnes of carbon dioxide equivalent in April to June". A second person reads each report before it is sent.
  - id: C-01-03
    dp: C-01
    title: Practice - Engagement plan and weekly status
    version: "2026-04"
    tags: [project, plan, status, coordination, milestones]
    summary: Each engagement has a plan with 4 to 8 milestones, each with an owner and a date. The coordinator sends a status every week with done, next and blocked items. A blocked item older than 5 working days goes to the delivery head.
    body: >-
      Each engagement has a plan with 4 to 8 milestones. Each milestone has an owner and a date. The coordinator sends a status every week
      with three lists: done, next and blocked. A blocked item older than 5 working days goes to the delivery head.
      Dates that move are changed in the plan and the reason is written next to the change.
  - id: L-01-01
    dp: L-01
    title: Lesson - Client data arriving after the agreed date
    version: "2026-03"
    tags: [lesson, data, delay, client, planning]
    summary: In 3 of 5 recent engagements the client data arrived late, which pushed the report by about a week. Engagements that asked for a sample file in week 1 found format problems early. The sample file request is now part of the plan.
    body: >-
      In 3 of 5 recent engagements the client data arrived after the agreed date and the report slipped by about a week.
      The engagements that asked for a small sample file in week 1 found format problems early. Asking for the sample file is now a milestone in the plan.
      The coordinator also asks the client for a named data contact at the start.
  - id: L-01-02
    dp: L-01
    title: Lesson - Figures changed after a report was issued
    version: "2026-04"
    tags: [lesson, restatement, review, carbon, report]
    summary: Two reports needed a corrected total because a unit was converted twice. A second-person check of unit conversions would have caught both. The check is now a line on the compliance checklist.
    body: >-
      Two reports needed a corrected total after issue because one unit was converted twice. Both errors were found by the client.
      A second-person check of the unit conversions would have caught them. The check is now a line on the compliance checklist.
      A corrected report carries a short note that states what changed and the old and new totals.
