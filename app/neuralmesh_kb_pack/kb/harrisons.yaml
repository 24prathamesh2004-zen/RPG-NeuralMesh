docs:
  - id: O-05-01
    dp: O-05
    title: Seasonal pattern of latex spoilage (aggregate)
    tags: [latex, spoilage, seasonality, monsoon, pre-coagulation]
    summary: >-
      Pre-coagulation is the largest spoilage cause in every season. Its share of total spoilage is about $MON_PRECOAG% in June-August
      versus about $WIN_PRECOAG% in December-February. Aggregates only; no estate or worker records.
  - id: O-05-02
    dp: O-05
    title: Spoilage by collection-to-factory time band (aggregate)
    tags: [latex, spoilage, transport, delay, time-band]
    summary: >-
      Total spoilage averages $BAND_LOW% of latex collected where the collection-to-factory time is under 2.5 hours,
      against $BAND_HIGH% where it exceeds 3.5 hours. Cells with fewer than three estates are suppressed.
  - id: O-05-03
    dp: O-05
    title: Cause mix across the year (aggregate)
    tags: [latex, spoilage, contamination, temperature]
    summary: >-
      Contamination losses stay between $CONTAM_MIN% and $CONTAM_MAX% of latex collected in every month, so they are a steady,
      controllable cause. Temperature-related losses peak in March-May at about $TEMP_PEAK% of latex collected.
  - id: O-05-04
    dp: O-05
    title: "Current gap - no lot-level quality trending at factory receipt"
    tags: [latex, quality, traceability, gap]
    summary: >-
      Collection time is logged at the collection point, but factory receipt does not yet trend quality results per lot or per
      collection round, so drift is found late. (Owner-stated gap.)
  - id: F-01-01
    dp: F-01
    title: SOP - Latex collection and cup handling
    tags: [sop, collection, latex, cups]
    summary: Rounds start at first light; cups are emptied within the agreed window after tapping; latex is strained into rinsed, covered buckets kept in shade; collection time is logged at the collection point.
    body: >-
      Collection rounds start at first light. Cups are emptied within the agreed window after tapping. Latex is poured through a clean
      strainer into rinsed buckets. Buckets are covered and kept in shade. The collector logs the time of collection at the collection point.

      Cups and buckets are rinsed daily; visible coagulum is kept apart from liquid latex and never mixed back.
  - id: F-01-02
    dp: F-01
    title: SOP - Anticoagulant dosing and field preservation
    tags: [sop, anticoagulant, preservation, dosing]
    summary: Anticoagulant is prepared in measured batches by trained staff, dosed at the collection point on schedule, recorded per round, and increased on rain days.
    body: >-
      Anticoagulant is prepared in measured batches by trained staff. Dosing is applied at the collection point on the stated schedule and the
      dose is recorded per round. Dosing is increased on rain days as set out in the monsoon procedure.
  - id: F-01-03
    dp: F-01
    title: SOP - Transport and factory receipt
    tags: [sop, transport, receipt, factory]
    summary: Loads leave on a fixed schedule in cleaned, covered vehicles; arrival time and visible coagulum or contamination are logged at receipt; quality results are filed per day, not per lot.
    body: >-
      Loads leave the collection point on a fixed schedule. Vehicles are cleaned and covered. At receipt, the time of arrival is logged and
      visible coagulum or contamination is recorded against the round. Quality testing results are filed per day, not per lot.
  - id: F-01-04
    dp: F-01
    title: SOP - Contamination control at collection points
    tags: [sop, contamination, hygiene]
    summary: Collection points are cleaned daily, strainers are checked at the start of each round, and foreign matter is recorded against the round and discussed weekly.
    body: >-
      Collection points are cleaned daily. Strainers are checked for damage at the start of each round. Foreign matter found in latex is recorded
      with the round and the collector, and discussed at the weekly estate meeting.
  - id: F-01-05
    dp: F-01
    title: SOP - Monsoon operating procedure
    tags: [sop, monsoon, rain, rain-guards]
    summary: Rain guards are fitted before the season; on rain days rounds are shorter and more frequent, anticoagulant dosing is increased and transport is prioritised.
    body: >-
      Rain guards are fitted before the season. Rounds are shortened and collection frequency is raised on rain days. Anticoagulant dosing is
      increased on rain days and transport is prioritised so latex reaches the factory sooner.
  - id: F-02-01
    dp: F-02
    title: Title-dispute file (restricted)
    tags: [legal, restricted]
    summary: Restricted legal file. Metadata only.
    private_body: "Mock legal file. CANARY-HARR-TITLE-5520"
facts:
