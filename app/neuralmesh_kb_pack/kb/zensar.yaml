    tags: [pilot, support, knowledge]
    summary: A knowledge assistant helped resolve repeat tickets faster but needed curated sources. Client name removed.
  - id: F-01-01
    dp: F-01
    title: Responsible AI usage policy
    version: "2026-01"
    tags: [policy, ai, data-handling]
    summary: Policy for using AI tools, covering data handling, review and logging.
    body: >-
      AI tools may be used only through approved gateways. Client confidential data is not entered into prompts. Outputs are reviewed by a person before use.
