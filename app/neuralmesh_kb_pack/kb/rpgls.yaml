docs:
  - id: O-01-01
    dp: O-01
    title: SOP - Batch manufacturing record completion
    version: "2026-02"
    tags: [gmp, batch-record, documentation, shop-floor]
    summary: >-
      Every step of a batch is signed in the batch record at the time it is done, with date, time and the equipment used. Entries are never overwritten. A correction is a single line with initials, date and reason. The supervisor checks the record before the batch moves to the next stage.
    body: >-
      Every step of a batch is signed in the batch record at the time it is done. The entry shows the date, the time and the equipment used. Entries are never overwritten or erased. A correction is a single line through the entry with initials, date and reason. The supervisor checks the record before the batch moves to the next stage. Blank fields are marked as not applicable, never left empty.
  - id: O-01-02
    dp: O-01
    title: SOP - Line clearance and equipment cleaning
    version: "2026-02"
    tags: [gmp, line-clearance, cleaning, changeover, contamination]
    summary: >-
      Before a new batch starts, the line is cleared of the previous product, labels and records, and a second person verifies it. Equipment is cleaned by the written method and tagged with its cleaned status and the hold time. Use after the hold time needs a repeat cleaning.
    body: >-
      Before a new batch starts, the line is cleared of the previous product, labels, packing material and records. A second person verifies the clearance and signs. Equipment is cleaned by the written method for its type. A tag shows the cleaned status, the date and the hold time. If the hold time is exceeded, the equipment is cleaned again before use. Any doubt stops the line until the supervisor decides.
  - id: O-01-03
    dp: O-01
    title: SOP - Solvent handling and work permits
    version: "2026-02"
    tags: [safety, solvent, work-permit, ventilation, earthing]
    summary: >-
      Solvents are drawn only in ventilated areas with earthed containers and without ignition sources. Hot work, confined space entry and maintenance in solvent areas need a signed work permit that lists the hazards, the controls and the person who closes it.
    body: >-
      Solvents are drawn only in ventilated areas. Containers are earthed during transfer and no ignition source is allowed nearby. Hot work, confined space entry and maintenance in solvent areas need a signed work permit. The permit lists the hazards, the controls and the person who closes it. Operators wear the protective equipment listed at the area entrance. Spills are contained with absorbent material and reported the same shift.
  - id: O-01-04
    dp: O-01
    title: SOP - Near-miss reporting and weekly review
    version: "2026-02"
    tags: [safety, near-miss, reporting, review]
    summary: >-
      Any unsafe event without injury is reported on a short form before the end of the shift. The plant safety group reviews all forms weekly, groups them by area and cause, and tracks each action to closure. Three or more reports of the same kind in a month trigger a joint review.
    body: >-
      Any unsafe event without injury is reported on a short form before the end of the shift. Anyone may report without fear of blame. The plant safety group reviews all forms weekly. Reports are grouped by area and cause. Each action is tracked to closure with an owner and a date. Three or more reports of the same kind in a month trigger a joint review with the area supervisors.
  - id: E-01-01
    dp: E-01
    title: In-process and release testing programme
    version: "2026-03"
    tags: [quality-control, testing, sampling, out-of-specification]
    summary: >-
      Samples are drawn by a written plan at defined stages and tested with calibrated instruments. A result outside its limit is a suspected out-of-specification result. It is checked for lab error first, then escalated to a formal investigation within 1 working day if no lab error is found.
    body: >-
      Samples are drawn by a written plan at defined stages of each batch. Tests use calibrated instruments and qualified analysts. A result outside its limit is a suspected out-of-specification result. The first step is a documented check for laboratory error. If none is found, a formal investigation opens within 1 working day. Retesting without a documented reason is not allowed. All raw data stays with the test record.
  - id: E-01-02
    dp: E-01
    title: Cleaning validation and stability studies
    version: "2026-03"
    tags: [validation, cleaning, stability, residue, protocol]
    summary: >-
      Cleaning validation proves that residue of the previous product, and of the cleaning agent, stays below the set limit on the hardest-to-clean spot, in 3 consecutive runs. Stability studies store batches at set conditions and test them at planned intervals to support the shelf life.
    body: >-
      Cleaning validation proves that residue of the previous product and of the cleaning agent stays below the set limit. Samples are taken from the hardest-to-clean spots. Three consecutive successful runs are needed. Stability studies store batches at set temperature and humidity conditions. They are tested at planned intervals. The results support the stated shelf life. A trend that moves toward a limit is reported before it crosses it.
  - id: F-01-01
    dp: F-01
    title: Batch release, deviations and CAPA
    version: "2026-04"
    tags: [qa, batch-release, deviation, capa, root-cause]
    summary: >-
      A batch is released only after quality assurance reviews the batch record, test results and all deviations. Each deviation is classed minor, major or critical and investigated to root cause. A corrective and preventive action (CAPA) has an owner and a due date, and its effect is checked after 3 months.
    body: >-
      A batch is released only after quality assurance reviews the batch record, the test results and every deviation. Each deviation is classed as minor, major or critical. It is investigated to root cause with the people who were on the line. A corrective and preventive action (CAPA) has an owner and a due date. Its effect is checked after 3 months. A repeat deviation reopens the earlier CAPA.
  - id: F-01-02
    dp: F-01
    title: Change control and regulatory notifications
    version: "2026-04"
    tags: [regulatory, change-control, notification, impact]
    summary: >-
      Every change to a process, material, site or specification is raised as a change request and assessed by quality, production and regulatory affairs. Regulatory affairs decides whether the change needs a notification or prior approval. The change is implemented only after that decision is filed.
    body: >-
      Every change to a process, material, site or specification is raised as a change request. Quality, production and regulatory affairs assess it together. Regulatory affairs decides whether the change needs a notification or prior approval. The change is implemented only after that decision is filed. Affected documents are updated and staff are trained before the first batch under the change.
  - id: F-01-03
    dp: F-01
    title: Dossier preparation and review
    version: "2026-04"
    tags: [regulatory, dossier, submission, review]
    summary: >-
      A dossier is built from a checklist of sections owned by named functions. Each section is checked against source data by a second reviewer. Regulatory affairs runs a final consistency review of names, strengths and figures before submission and keeps a log of questions raised by the authority.
    body: >-
      A dossier is built from a checklist of sections, each owned by a named function. Each section is checked against source data by a second reviewer. Regulatory affairs runs a final consistency review of names, strengths and figures before submission. Questions raised by the authority are logged with the reply date. Answers are drafted by the owning function and approved by regulatory affairs.
  - id: C-01-01
    dp: C-01
    title: Ethical promotion code for medical representatives
    version: "2026-01"
    tags: [promotion, code, compliance, medical-representative]
    summary: >-
      Representatives promote only within the approved product information, give balanced and accurate facts, and offer no gift or inducement to prescribers. Claims outside the approved information are not made. Any complaint about promotion is reported to the compliance lead within 2 working days.
    body: >-
      Representatives promote only within the approved product information. Facts are balanced and accurate. No gift or inducement is offered to prescribers. Claims outside the approved information are not made. Questions that go beyond the approved information are passed to the medical team. Any complaint about promotion is reported to the compliance lead within 2 working days.
  - id: C-01-02
    dp: C-01
    title: Product knowledge training and sample handling
    version: "2026-01"
    tags: [training, product-knowledge, samples, field-force]
    summary: >-
      New representatives complete product training and pass a knowledge test before the first visit. Samples are issued against a signed request, stored as labelled, counted at each visit and reconciled monthly. Expired samples are returned and never given out.
    body: >-
      New representatives complete product training and pass a knowledge test before the first visit. Refresher tests run every 6 months. Samples are issued against a signed request and stored as labelled. They are counted at each visit and reconciled monthly. Expired samples are returned and never given out. Differences are reported to the area manager the same week.
