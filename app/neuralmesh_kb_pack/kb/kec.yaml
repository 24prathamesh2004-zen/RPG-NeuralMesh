docs:
  - id: L-02-01
    dp: L-02
    title: Overseas integration post-mortem - first 100 days
    version: "2026-02"
    tags: [integration, acquisition, overseas, post-mortem, process-ownership]
    summary: >-
      Systems were cut over before process owners were agreed, so teams rebuilt workarounds. Agreeing process ownership first, then gating
      cut-over behind a sign-off, is the main recommendation. (Illustrative.)
  - id: L-02-02
    dp: L-02
    title: Overseas mobilisation lessons - labour, contracts, payment cycles
    version: "2026-02"
    tags: [mobilisation, labour, contracts, payment-cycle, overseas]
    summary: >-
      Local labour rules, contract terms and payment cycles surfaced after day 60 and were underestimated at close. A review by day 30 is advised.
  - id: L-02a-01
    dp: L-02a
    title: Post-mortem annex - claims and labour
    version: "2026-02"
    tags: [claims, labour, annex, restricted-content]
    summary: Full annex with claim figures and named parties. Owner approval required.
    body: >-
      Annex covering claim positions, counterparties and labour settlement terms for the overseas integration. Access needs approval from the PMO head.
      CANARY-KEC-CLAIMS-4410
  - id: O-06-01
    dp: O-06
    title: Delay pattern summary across projects
    version: "2026-03"
    tags: [delay, projects, patterns, site]
    summary: >-
      Across the mock project set, the most frequent delay category is $TOP_CAT ($TOP_SHARE% of delay notes), followed by $SECOND_CAT.
      Material-supply delays often follow late release of purchase orders.
  - id: E-04-01
    dp: E-04
    title: Tower design standard revisions - summary
    version: "2026-01"
    tags: [tower, design, standards, galvanising]
    summary: Summary of recent design standard revisions and the type-test findings that drove them. No customer-specific data.
  - id: E-05-01
    dp: E-05
    title: Elastomer and cable material ageing tests - summary
    version: "2026-02"
    tags: [elastomer, ageing, cable, heat-ageing, ozone]
    summary: >-
      Heat-ageing and ozone-resistance tests on elastomer cable materials show properties drift faster in lots stored warm or long before use.
      Storage and time-to-use limits were added to material handling.
  - id: C-01-01
    dp: C-01
    title: Bid price book (restricted)
    version: "2026-08"
    tags: [bid, pricing, restricted]
    summary: Restricted bid pricing. Metadata only.
    private_body: "Mock bid pricing. CANARY-KEC-BID-8801"
  - id: C-02-01
    dp: C-02
    title: Liquidated damages clause precedents
    version: "2026-01"
    tags: [contracts, liquidated-damages, precedents]
    summary: Precedent wording and negotiation outcomes for liquidated damages clauses. Counterparty names removed.
  - id: C-02-02
    dp: C-02
    title: Payment-term precedents on overseas contracts
    version: "2026-01"
    tags: [contracts, payment, overseas, precedents]
    summary: Payment-term clauses used on overseas contracts and the cash-cycle effect seen. Counterparty names removed.
  - id: O-01-01
    dp: O-01
    title: Cable extrusion line RCA - die wear pattern
    version: "2026-02"
    tags: [maintenance, extrusion, cables, rca]
    summary: RCA of repeated die wear on a cable extrusion line and the inspection interval change that fixed it.
    body: >-
      Repeated die wear on an extrusion line was traced to inspection intervals that did not match throughput. Intervals were shortened and a wear gauge was added to the shift checklist.
      Scrap fell in the following quarter.
  - id: O-02-01
    dp: O-02
    title: Near-miss pattern - working at height during tower erection (anonymised)
    version: "2026-02"
    tags: [hse, near-miss, working-at-height, tower]
    summary: Near-misses cluster at harness changeover points during tower erection. A second anchor point and a changeover checklist reduced repeats. Anonymised.
  - id: E-04-03
    dp: E-04
    title: Standard - Patrol priority for tower members (P1, P2, P3)
    version: "2026-01"
    tags: [standard, patrol, priority, tower, rust, zinc, bent]
    summary: >-
      P1 is a bent member or a crack at a joint, to be made safe within 48 hours. P2 is zinc loss with rust on more than a quarter of a
      member, to be scheduled within the quarter. P3 is surface rust with the zinc coat intact, recorded and re-checked at the next patrol.
    body: >-
      A patrol grades each tower member on three priorities. P1: a bent member or a crack at a joint, made safe within 48 hours. P2: zinc
      loss with rust on more than a quarter of the member length, repair scheduled within the quarter. P3: surface rust with the zinc coat
      intact, recorded and checked again at the next patrol. Missing or loose bolts raise the priority of the member by one step.
