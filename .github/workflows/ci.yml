name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Validate the knowledge packs and the graph rules
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          from knowledge.validator import validate_packs
          from services.ontology import ontology
          packs = [(p.name, json.loads(p.read_text())) for p in Path("neuralmesh_kb_pack/data_pack").glob("*/packs/*/pack.json")]
          packs += [(p.name, json.loads(p.read_text())) for p in Path("neuralmesh_kb_pack/group").glob("*.pack.json")]
          report = validate_packs(packs, strict=True)
          assert not report.errors, report.errors
          assert "core" in ontology().domains
          print(len(packs), "packs valid")
          EOF
      - name: Tests (the ones that need the embedding model skip themselves)
        run: python -m pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
